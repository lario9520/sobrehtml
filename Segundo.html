<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O que é HTML?</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            color: #222;
            line-height: 1.7;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #1565c0;
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 18px;
        }

        h2 {
            color: #1565c0;
            margin-top: 30px;
            margin-bottom: 12px;
        }

        h3 {
            color: #333;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 15px;
            font-size: 17px;
        }

        .destaque {
            background: #e3f2fd;
            border-left: 6px solid #1565c0;
            padding: 18px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .exemplo {
            background: #1e1e1e;
            color: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            overflow-x: auto;
        }

        .exemplo pre {
            font-family: Consolas, monospace;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .explicacao {
            background: #f5f5f5;
            padding: 18px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .estrutura {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 25px 0;
        }

        .parte {
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .doctype {
            background: #6a1b9a;
        }

        .html {
            background: #1565c0;
        }

        .head {
            background: #00897b;
        }

        .body {
            background: #ef6c00;
        }

        .exemplo-visual {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        .visual-topo {
            background: #1565c0;
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .visual-menu {
            background: #eeeeee;
            padding: 10px;
        }

        .visual-conteudo {
            padding: 25px;
            min-height: 150px;
        }

        .visual-rodape {
            background: #333;
            color: white;
            text-align: center;
            padding: 12px;
        }

        .resumo {
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .botoes {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 40px;
        }

        .botao {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .voltar {
            background: #757575;
            color: white;
        }

        .questionario {
            background: #1565c0;
            color: white;
        }

        .botao:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                padding: 20px;
            }

            header h1 {
                font-size: 28px;
            }

            .botoes {
                flex-direction: column;
            }
        }
          .btn-link {
        display: inline-block;
        padding: 10px 20px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        transition: background-color 0.3s;
    }
    .btn-link:hover {
        background-color: #0056b3;
    }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🌐 O que é HTML?a cabou po aqui lkkkkkkk</h1>
        <p>Entenda de forma simples o que é HTML e para que ele serve.</p>
   

    <!-- BOTÕES -->

    <div class="botoes">

        <!--
            BOTÃO VOLTAR

            TROQUE "#" pelo endereço da página anterior.

            Exemplo:
            href="index.html"
        -->

        <a href="#" class="botao voltar">
            ← Voltar
        </a>


        <!--
            BOTÃO QUESTIONÁRIO

            TROQUE "#" pelo endereço do seu questionário.

            Exemplo:
            href="questionario.html"

            Ou coloque um link de um site:
            href="https://seusite.com/questionario"
        -->

        <a href="index.html" class="btn-link" target="_blank">
    📄 voutar/oq e html
</a>

    </div>

    <footer>
        Aula de HTML • Estrutura de uma página
    </footer>

</div>

</body>
</html>
